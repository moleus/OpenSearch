name: Publish searchable snapshot repro image
on:
  push:
    branches: [repro-remote-snapshot-slow-start]
    paths:
      - .github/workflows/remote-snapshot-repro-image.yml
      - repro/remote-snapshot-slow-start/Dockerfile
      - repro/remote-snapshot-slow-start/fix.patch
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.repository == 'moleus/OpenSearch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: repro/remote-snapshot-slow-start
          target: fixed
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/moleus/opensearch:3.9.0-pr23563-5d346ded
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'ghcr.io/moleus/opensearch:3.9.0-pr23563-5d346ded@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
