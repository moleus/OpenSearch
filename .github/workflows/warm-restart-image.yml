name: Warm restart test image

# Takes the one commit at the tip of `patch_ref`, applies it to a released OpenSearch tag, builds
# the server jar, and overlays the jar on the released opensearchproject/opensearch image of the same
# version. Use the image on a test stand to compare a stock node with a patched node.
# Run it from the Actions tab (workflow_dispatch). The image goes to ghcr.io/<owner>/opensearch:<tag>.

on:
  workflow_dispatch:
    inputs:
      patch_ref:
        description: Branch in this repository. Its tip commit is the patch.
        required: true
        default: fix/remote-snapshot-directory-off-applier
      base_tag:
        description: Upstream release tag to patch. It must match the base image version.
        required: true
        default: 3.9.0
      base_image:
        description: Released image that gets the new server jar
        required: true
        default: opensearchproject/opensearch:3.9.0
      tag:
        description: Image tag
        required: true
        default: 3.9.0-applier-fix

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.patch_ref }}
          fetch-depth: 2
      - name: Take the patch from the tip commit
        run: git diff HEAD~1 HEAD > "$RUNNER_TEMP/fix.patch" && wc -l "$RUNNER_TEMP/fix.patch"
      - name: Check out the release tag and apply the patch
        run: |
          git fetch --depth 1 https://github.com/opensearch-project/OpenSearch.git "refs/tags/${{ inputs.base_tag }}"
          git checkout --force FETCH_HEAD
          git apply "$RUNNER_TEMP/fix.patch"
          git status --short
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Build the server jar
        run: |
          start=$(date +%s)
          ./gradlew :server:jar -Dbuild.snapshot=false --console=plain
          echo "build seconds: $(( $(date +%s) - start ))"
          ls -l server/build/distributions/
      - name: Build the image
        run: |
          mkdir "$RUNNER_TEMP/ctx"
          cp "server/build/distributions/opensearch-${{ inputs.base_tag }}.jar" "$RUNNER_TEMP/ctx/server.jar"
          cat > "$RUNNER_TEMP/ctx/Dockerfile" <<EOD
          FROM ${{ inputs.base_image }}
          COPY --chown=opensearch:opensearch server.jar /usr/share/opensearch/lib/opensearch-${{ inputs.base_tag }}.jar
          EOD
          docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opensearch:${{ inputs.tag }}" "$RUNNER_TEMP/ctx"
      - name: Push the image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opensearch:${{ inputs.tag }}"
